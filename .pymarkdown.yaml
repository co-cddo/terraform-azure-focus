# The BEGIN_TF_DOCS / END_TF_DOCS sections in the README files are generated by
# terraform-docs (html: true, anchor: true), which emits long table rows and
# inline <a name="..."></a> anchors that cannot be hand-reflowed. The HCL usage
# examples also contain unbreakable values (ARM resource IDs, git refs). Relax
# the rules those generated/example blocks trip; all others keep their defaults.
plugins:
  MD013:
    enabled: true
    line_length: 500
    code_block_line_length: 500
  MD033:
    enabled: false
  # The generated TF_DOCS block is injected without blank-line padding so it
  # matches the CI terraform-docs gh-action output exactly. That places the
  # first heading directly under the <!-- BEGIN_TF_DOCS --> marker, which MD022
  # (blanks-around-headings) would otherwise flag.
  MD022:
    enabled: false
