#header-from: .header.md
settings:
  anchor: true
  color: true
  default: true
  escape: true
  html: true
  indent: 2
  required: true
  sensitive: true
  type: true
  lockfile: false

formatter: "markdown table"

output:
  file: README.md
  mode: inject
  # No blank-line padding inside the markers: the appvia CI workflow runs the
  # terraform-docs gh-action with its own unpadded --output-template, so padding
  # here produces a diff CI flags as uncommitted changes. MD022 is disabled in
  # .pymarkdown.yaml to allow the unpadded heading.
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sections:
  show:
    - providers
    - inputs
    - outputs

sort:
  enabled: true
  by: required
