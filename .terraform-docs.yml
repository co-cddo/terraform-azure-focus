#header-from: .header.md
settings:
  anchor: true
  color: true
  default: true
  escape: true
  html: true
  indent: 2
  required: true
  sensitive: true
  type: true
  lockfile: false

formatter: "markdown table"

output:
  file: README.md
  mode: inject
  # Surround the generated block with blank lines so the first/last headings
  # satisfy pymarkdown MD022 (blanks-around-headings).
  template: |-
    <!-- BEGIN_TF_DOCS -->

    {{ .Content }}

    <!-- END_TF_DOCS -->

sections:
  show:
    - providers
    - inputs
    - outputs

sort:
  enabled: true
  by: required
