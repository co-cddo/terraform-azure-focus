name: Create Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: 'Create a release candidate (vx.x.x-rc.x)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      increment:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: string
      prerelease:
        description: 'Create a release candidate (vx.x.x-rc.x)'
        required: false
        default: false
        type: boolean
    outputs:
      tag:
        description: 'The new release tag'
        value: ${{ jobs.release.outputs.new_tag }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.set_output.outputs.new_tag }}

    steps:
      - name: Validate increment input
        run: |
          if [[ "${{ inputs.increment }}" != "major" && "${{ inputs.increment }}" != "minor" && "${{ inputs.increment }}" != "patch" ]]; then
            echo "Error: 'increment' must be 'major', 'minor', or 'patch', got '${{ inputs.increment }}'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: version
        run: |
          PRERELEASE="${{ inputs.prerelease }}"
          INCREMENT="${{ inputs.increment }}"

          # Find the latest stable tag (no prerelease suffix)
          LATEST_STABLE=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          echo "Latest stable tag: ${LATEST_STABLE:-none}"

          # Release notes are generated against this tag, so leave it empty on the
          # first ever release rather than referencing a tag that does not exist
          echo "PREVIOUS_TAG=$LATEST_STABLE" >> $GITHUB_ENV

          # Parse the stable version
          VERSION=${LATEST_STABLE:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION#v}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Apply the increment to get the target base version
          if [ "$INCREMENT" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$INCREMENT" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          TARGET_BASE="v${MAJOR}.${MINOR}.${PATCH}"

          if [ "$PRERELEASE" = "true" ]; then
            # Highest RC number already used for this target base version. Only
            # well formed RC tags are matched, so a stray tag such as
            # v1.1.0-rc.beta cannot reach the arithmetic below
            LATEST_RC_NUM=$(git tag --list "${TARGET_BASE}-rc.*" \
              | grep -E "^v${MAJOR}\.${MINOR}\.${PATCH}-rc\.[0-9]+$" \
              | sed 's/.*-rc\.//' \
              | sort -n \
              | tail -n 1 || true)

            NEW_TAG="${TARGET_BASE}-rc.$(( ${LATEST_RC_NUM:-0} + 1 ))"
          else
            NEW_TAG="$TARGET_BASE"
          fi

          echo "Next tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create Release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ env.NEW_TAG }} \
            ${PREVIOUS_TAG:+-f previous_tag_name=$PREVIOUS_TAG} \
            --jq .body)

          cat <<EOF > release_notes.md
          Released by @${{ github.actor }}

          ${GENERATED_NOTES}
          EOF

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release create ${{ env.NEW_TAG }} \
              --title "${{ env.NEW_TAG }}" \
              --notes-file release_notes.md \
              --prerelease
          else
            gh release create ${{ env.NEW_TAG }} \
              --title "${{ env.NEW_TAG }}" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Set output
        id: set_output
        run: echo "new_tag=${{ env.NEW_TAG }}" >> $GITHUB_OUTPUT
