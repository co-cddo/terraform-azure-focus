---
name: Python Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/cost_export/requirements.in
            src/cost_export/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest \
            pytest-mock \
            requests-mock \
            $(grep -v '^\s*#' src/cost_export/requirements.in | grep -v '^\s*$')

      - name: Run tests
        # pytest exits 5 when no tests are collected; treat that as success.
        # The || construct keeps bash -e from treating the non-zero exit as fatal.
        run: pytest || [ $? -eq 5 ]
