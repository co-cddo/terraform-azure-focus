---
name: Python Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/cost_export/requirements.in
            src/cost_export/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest \
            pytest-mock \
            requests-mock \
            $(grep -v '^\s*#' src/cost_export/requirements.in | grep -v '^\s*$')

      - name: Run tests
        run: |
          pytest
          exit_code=$?
          # Exit code 5 means no tests were collected — treat as success
          [ $exit_code -eq 5 ] && exit 0 || exit $exit_code
